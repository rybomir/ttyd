name: release

on:
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build
        required: true
        type: string

jobs:
  build:
    uses: ./.github/workflows/backend.yml
  publish:
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Generate release notes
        run: |
          git fetch https://github.com/tsl0922/ttyd.git refs/tags/1.7.7:refs/tags/1.7.7
          git log --reverse --format='- %s (%h)' 1.7.7..HEAD > release-notes.md
      - name: Check version bump
        run: |
          TAG=$(git describe --tags --match "[0-9]*.[0-9]*.[0-9]*" --abbrev=8)
          VERSION=$(grep project CMakeLists.txt| awk '{print $3}')
          if [ "$TAG" != "$VERSION" ]; then
            echo "=== Version in CMakeLists.txt and git tag does not match!"
            echo "=== Git Tag: $TAG, Version: $VERSION"
            exit 1
          fi
      - uses: actions/download-artifact@v8
        
      - run: |
          mkdir build
          for file in ttyd.*/*; do
            target=$(echo $file | awk -F/ '{print $1}')
            [[ $file == *.exe ]] && target="$target.exe"
            mv $file build/$target
          done
          pushd build; sha256sum ttyd.* > SHA256SUMS; popd
      - uses: ncipollo/release-action@v1
        with:
          tag: ${{ inputs.tag || github.ref_name }}
          artifacts: build/*
          bodyFile: release-notes.md
          allowUpdates: true
          draft: false
